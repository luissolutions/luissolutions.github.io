<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Louverse</title>
  <meta name="description" content="One shell, many blocks: the Louverse apps as blocks on a board you arrange.">
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="assets/louverse.css">
</head>
<body>
  <!-- THE SHELL (L 2026-10-03: "one shell should be what shows what you want on the screen"). The header keeps the websites'
       feel; the board below is a grid of blocks. Blocks are views over core/ (jobs, ledger ...) - no logic lives in a block. -->
  <header class="lv-head">
    <a class="logo" href="https://luissolutions.us/websites/index.html">Luis' <span class="web">Web</span> Space</a>
    <nav>
      <a href="https://luissolutions.us/index.html">Home</a>
      <a href="https://luissolutions.us/websites/index.html">Websites</a>
      <a href="https://luissolutions.us/hub.html">Hub</a>
      <a href="https://luissolutions.us/apps/online/onlinelinks.html">Links</a>
    </nav>
    <span class="sp"></span>
    <span class="who" id="who">…</span>
    <button type="button" class="lv-btn" id="auth-btn">Sign in</button>
  </header>

  <div class="lv-bar">
    <button type="button" class="lv-btn primary" id="add">+ Block</button>
    <span class="lbl">Preset</span>
    <select id="preset"><option value="">—</option><option>Field</option><option>Jobs</option><option>Finance</option></select>
    <span class="lbl">Year</span>
    <select id="year"></select>
    <span class="status" id="status"></span>
  </div>

  <main class="lv-grid" id="grid" aria-label="Blocks"></main>

  <script type="module">
    import { whenAuthReady, onUser, baseFor, signIn, signOutNow } from "./core/firebase.js";
    import { store } from "./core/store.js";
    import { loadLayout, saveLayout, addBlock, removeBlock, fromPreset, getLayout } from "./core/layout.js";
    import { mountBlock, settle, place } from "./ui/block.js";
    import * as joblist from "./ui/blocks/joblist.js";
    import * as jobcard from "./ui/blocks/jobcard.js";
    import * as photoset from "./ui/blocks/photoset.js";
    import * as ledger from "./ui/blocks/ledger.js";
    import * as page from "./ui/blocks/page.js";

    // the block registry: type -> { title, mount }. Adding a block kind = one file in ui/blocks + one line here.
    const BLOCKS = { joblist, jobcard, photoset, ledger, page };
    const DESC = { joblist: "your jobs, searchable", jobcard: "the picked job's record", photoset: "the picked job's photos", ledger: "the year's spending", page: "any page in a frame" };
    const $ = id => document.getElementById(id), grid = $("grid"), status = $("status");
    const mounted = new Map();   // id -> block api

    const yearSel = $("year"); const Y = new Date().getFullYear(); for (let y = Y; y >= Y - 4; y--) yearSel.add(new Option(y, y)); yearSel.value = String(store.get("year"));
    yearSel.onchange = () => store.set("year", Number(yearSel.value));

    function render(layout) {
      for (const b of mounted.values()) b.el.remove(); mounted.clear(); grid.innerHTML = "";
      for (const spec of layout.blocks) {
        const def = BLOCKS[spec.type]; if (!def) continue;
        const api = mountBlock(grid, spec, def, { store, save: () => saveLayout(layout) }, {
          onChange: (s, moved) => { if (moved) { settle(layout.blocks, s); for (const o of layout.blocks) { const m = mounted.get(o.id); if (m) place(m.el, o); } } saveLayout(layout); flash("saved"); },
          onRemove: s => { removeBlock(s.id); mounted.delete(s.id); flash("removed"); } });
        mounted.set(spec.id, api);
      }
      if (!layout.blocks.length) grid.innerHTML = `<div class="lv-empty" style="grid-column:1/-1">Empty board - add a block or pick a preset.</div>`;
    }
    let flashT = 0; const flash = t => { status.textContent = t; clearTimeout(flashT); flashT = setTimeout(() => { status.textContent = ""; }, 1800); };

    // + Block palette
    $("add").onclick = e => { e.stopPropagation(); document.querySelector(".lv-pop")?.remove();
      const pop = document.createElement("div"); pop.className = "lv-pop"; pop.innerHTML = Object.keys(BLOCKS).map(t => `<button type="button" data-t="${t}">${BLOCKS[t].title}<small>${DESC[t]}</small></button>`).join("");
      const r = e.currentTarget.getBoundingClientRect(); pop.style.left = r.left + "px"; pop.style.top = (r.bottom + 4 + scrollY) + "px"; document.body.appendChild(pop);
      pop.onclick = ev => { const b = ev.target.closest("[data-t]"); if (!b) return; addBlock(b.dataset.t); render(getLayout()); pop.remove(); flash("added"); };
      setTimeout(() => document.addEventListener("click", () => pop.remove(), { once: true }), 0); };
    $("preset").onchange = () => { const p = $("preset").value; if (!p) return; const l = fromPreset(p); saveLayout(l, { now: true }); render(l); $("preset").value = ""; flash(p + " preset"); };

    // sign in / out - the person types their own credentials here; nothing is stored by this page
    $("auth-btn").onclick = async () => {
      if (store.get("user")) { await signOutNow(); return; }
      const sheet = document.createElement("div"); sheet.className = "lv-sheet";
      sheet.innerHTML = `<form><h3>Sign in</h3><input type="email" placeholder="email" autocomplete="username" required><input type="password" placeholder="password" autocomplete="current-password" required><div class="lv-err" hidden></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="lv-btn" data-x>Cancel</button><button type="submit" class="lv-btn primary">Sign in</button></div></form>`;
      document.body.appendChild(sheet); sheet.querySelector("[data-x]").onclick = () => sheet.remove(); sheet.onclick = e => { if (e.target === sheet) sheet.remove(); };
      sheet.querySelector("form").onsubmit = async e => { e.preventDefault(); const [em, pw] = sheet.querySelectorAll("input"); const err = sheet.querySelector(".lv-err");
        try { await signIn(em.value.trim(), pw.value); sheet.remove(); } catch (x) { err.hidden = false; err.textContent = "Sign-in failed: " + (x.code || x.message); } };
    };

    // boot: the first auth answer, then this account's layout; a later sign-in / out reloads the board for that account
    whenAuthReady().then(async u => { await boot(u); onUser(async u2 => { if ((u2?.uid || null) !== (store.get("user")?.uid || null)) await boot(u2); }); });
    async function boot(user) {
      store.set("user", user); store.set("base", baseFor(user)); store.set("jobId", null); store.set("job", null);
      $("who").textContent = user ? user.email : "not signed in"; $("auth-btn").textContent = user ? "Sign out" : "Sign in";
      render(await loadLayout(user)); flash(user ? "board loaded" : "local board");
    }
    window.__lv = { store, getLayout, mounted };   // test hook
  </script>
</body>
</html>
