<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Louverse</title>
  <meta name="description" content="One canvas, many blocks: the Louverse apps as widgets you arrange, wired by arrows that show what follows what.">
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="assets/louverse.css">
</head>
<body>
  <!-- THE SHELL, v2 (L 2026-10-03: "like the Louverse, a bigger canvas; remove presets; remember in browser for now; the modules
       pop in like widgets and interconnect, arrows showing where other info will change; move it around on a grid; lots of
       real estate"). A slim header, then one big canvas: blocks are DOM widgets placed in world pixels; an SVG layer draws an
       arrow from every block that SETS a store key to every block that FOLLOWS it, and the arrow lights when the key changes. -->
  <header class="lv-head">
    <a class="logo" href="https://luissolutions.us/websites/index.html">Luis' <span class="web">Web</span> Space</a>
    <nav>
      <a href="https://luissolutions.us/index.html">Home</a>
      <a href="https://luissolutions.us/websites/index.html">Websites</a>
      <a href="https://luissolutions.us/hub.html">Hub</a>
      <a href="https://luissolutions.us/apps/online/onlinelinks.html">Links</a>
    </nav>
    <button type="button" class="lv-btn primary" id="add">+ Block</button>
    <button type="button" class="lv-btn ico" id="fit" title="fit every block on screen (or double-tap empty space)">⊡</button>
    <button type="button" class="lv-btn ico" id="zout" title="zoom out">−</button>
    <button type="button" class="lv-btn ico" id="zin" title="zoom in">+</button>
    <span class="sp"></span>
    <span class="who" id="who">…</span>
    <button type="button" class="lv-btn" id="auth-btn">Sign in</button>
  </header>

  <div class="lv-view" id="view" aria-label="Board">
    <div class="lv-world" id="world">
      <svg class="lv-links" id="links" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div class="lv-status" id="status"></div>

  <script type="module">
    import { whenAuthReady, onUser, baseFor, signIn, signOutNow } from "./core/firebase.js";
    import { store } from "./core/store.js";
    import { loadLayout, saveLayout, addBlock, removeBlock, getLayout, resetLayout } from "./core/layout.js";
    import { mountBlock, placeBlock } from "./ui/block.js";
    import { mountBoard } from "./ui/board.js";
    import * as year from "./ui/blocks/year.js";
    import * as joblist from "./ui/blocks/joblist.js";
    import * as jobcard from "./ui/blocks/jobcard.js";
    import * as photoset from "./ui/blocks/photoset.js";
    import * as ledger from "./ui/blocks/ledger.js";
    import * as page from "./ui/blocks/page.js";

    // the block registry: type -> { title, mount, pub, sub }. pub = store keys the block SETS, sub = keys it FOLLOWS; the
    // arrows on the board come from these. A new block kind = one file in ui/blocks + one line here.
    const BLOCKS = { year: { ...year }, joblist: { ...joblist, pub: ["jobId"] }, jobcard: { ...jobcard, sub: ["jobId"] }, photoset: { ...photoset, sub: ["jobId"] }, ledger: { ...ledger, sub: ["year"] }, page: { ...page } };
    const DESC = { year: "the year the money blocks read", joblist: "your jobs, searchable - sets the job", jobcard: "the picked job's record", photoset: "the picked job's photos", ledger: "the year's spending", page: "any page in a frame" };
    const $ = id => document.getElementById(id), viewEl = $("view"), worldEl = $("world"), linksEl = $("links"), status = $("status");
    const mounted = new Map();   // block id -> api
    let layout = null;
    let flashT = 0; const flash = t => { status.textContent = t; clearTimeout(flashT); flashT = setTimeout(() => { status.textContent = ""; }, 1600); };

    const board = mountBoard(viewEl, worldEl, linksEl, { onView: v => { if (layout) { layout.view = { x: v.x, y: v.y, s: v.s }; saveLayout(layout); } } });
    board.setFitAll(() => board.fit(layout.blocks));
    const blockEls = () => new Map([...mounted].map(([id, api]) => [id, api.el]));
    const arrows = () => board.drawArrows(layout.blocks, BLOCKS);

    function render() {
      for (const b of mounted.values()) b.el.remove(); mounted.clear();
      for (const spec of layout.blocks) {
        const def = BLOCKS[spec.type]; if (!def) continue;
        const api = mountBlock(worldEl, spec, def, { store, board, save: () => saveLayout(layout) }, {
          onMove: () => arrows(),
          onChange: () => { saveLayout(layout); arrows(); flash("saved"); },
          onRemove: s => { removeBlock(s.id); mounted.delete(s.id); arrows(); flash("removed"); } });
        mounted.set(spec.id, api);
      }
      arrows();
    }
    // a key changed somewhere: the arrows for it light up and the blocks on the receiving end flash
    store.on("*", (v, key) => board.pulse(key, blockEls()));

    // + Block: lands in the middle of what you are looking at
    $("add").onclick = e => { e.stopPropagation(); document.querySelector(".lv-pop")?.remove();
      const pop = document.createElement("div"); pop.className = "lv-pop"; pop.innerHTML = Object.keys(BLOCKS).map(t => `<button type="button" data-t="${t}">${BLOCKS[t].title}<small>${DESC[t]}</small></button>`).join("") + `<button type="button" data-reset="1">Reset the board<small>back to the starting layout</small></button>`;
      const r = e.currentTarget.getBoundingClientRect(); pop.style.left = Math.min(r.left, innerWidth - 240) + "px"; pop.style.top = (r.bottom + 4) + "px"; document.body.appendChild(pop);
      pop.onclick = ev => { const b = ev.target.closest("[data-t],[data-reset]"); if (!b) return; pop.remove();
        if (b.dataset.reset) { layout = resetLayout(); render(); board.fit(layout.blocks); flash("reset"); return; }
        const vr = viewEl.getBoundingClientRect(), [wx, wy] = board.toWorld(vr.left + vr.width / 2, vr.top + vr.height / 2);
        const spec = addBlock(b.dataset.t, { x: wx - 200, y: wy - 120 }); layout = getLayout(); render(); mounted.get(spec.id)?.el.scrollIntoView?.({ block: "nearest" }); flash("added " + BLOCKS[b.dataset.t].title); };
      setTimeout(() => document.addEventListener("click", () => pop.remove(), { once: true }), 0); };
    $("fit").onclick = () => board.fit(layout.blocks);
    $("zin").onclick = () => { const r = viewEl.getBoundingClientRect(); board.zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25); };
    $("zout").onclick = () => { const r = viewEl.getBoundingClientRect(); board.zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.25); };

    // sign in / out - the person types their own credentials here; nothing is stored by this page
    $("auth-btn").onclick = async () => {
      if (store.get("user")) { await signOutNow(); return; }
      const sheet = document.createElement("div"); sheet.className = "lv-sheet";
      sheet.innerHTML = `<form><h3>Sign in</h3><input type="email" placeholder="email" autocomplete="username" required><input type="password" placeholder="password" autocomplete="current-password" required><div class="lv-err" hidden></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="lv-btn" data-x>Cancel</button><button type="submit" class="lv-btn primary">Sign in</button></div></form>`;
      document.body.appendChild(sheet); sheet.querySelector("[data-x]").onclick = () => sheet.remove(); sheet.onclick = e => { if (e.target === sheet) sheet.remove(); };
      sheet.querySelector("form").onsubmit = async e => { e.preventDefault(); const [em, pw] = sheet.querySelectorAll("input"); const err = sheet.querySelector(".lv-err");
        try { await signIn(em.value.trim(), pw.value); sheet.remove(); } catch (x) { err.hidden = false; err.textContent = "Sign-in failed: " + (x.code || x.message); } };
    };

    // boot: the board from this browser, the first auth answer, then the blocks; a later sign-in / out remounts them for that account
    layout = loadLayout(); render(); if (!board.setView(layout.view)) board.fit(layout.blocks);
    whenAuthReady().then(async u => { await boot(u); onUser(async u2 => { if ((u2?.uid || null) !== (store.get("user")?.uid || null)) await boot(u2); }); });
    async function boot(user) {
      store.set("user", user); store.set("base", baseFor(user)); store.set("jobId", null); store.set("job", null);
      $("who").textContent = user ? user.email : "not signed in"; $("auth-btn").textContent = user ? "Sign out" : "Sign in";
      for (const api of mounted.values()) api.remount(); flash(user ? "signed in" : "local board");
    }
    window.__lv = { store, getLayout, mounted, board };   // test hook
  </script>
</body>
</html>
