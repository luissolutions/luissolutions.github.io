<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Louverse</title>
  <meta name="description" content="One board, many tiles: the Louverse apps as tiles you arrange, wired together so a change in one shows in the others.">
  <!-- the board's own icon (L 2026-10-04 "can the universe have a different favicon"): three tiles joined by wires on deep wine (L's burgundy, 2026-10-04) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%2333101c'/%3E%3Cpath d='M150 160L372 210L250 370Z' fill='none' stroke='%23c2475f' stroke-width='18' stroke-linejoin='round'/%3E%3Ccircle cx='150' cy='160' r='52' fill='%23fff0f3'/%3E%3Ccircle cx='150' cy='160' r='40' fill='%23c2475f'/%3E%3Ccircle cx='372' cy='210' r='40' fill='%23fff0f3'/%3E%3Ccircle cx='372' cy='210' r='28' fill='%23c2475f'/%3E%3Ccircle cx='250' cy='370' r='46' fill='%23fff0f3'/%3E%3Ccircle cx='250' cy='370' r='34' fill='%23c2475f'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <meta name="theme-color" content="#33101c">
  <!-- PHONE MODE before first paint (2026-10-04): html.lv-phone = a touch device whose shorter side is <= 640 (portrait OR landscape) or a
       window <= 640 wide - the same test as core/layout NARROW; the CSS keys off the class, not a width media query -->
  <script>(function () { try { var w = innerWidth, h = innerHeight, c = window.matchMedia && matchMedia("(pointer: coarse)").matches; document.documentElement.classList.toggle("lv-phone", /[?&]phone=1/.test(location.search) || w <= 640 || (c && Math.min(w, h) <= 640)); } catch (e) {} })();</script>
  <link rel="stylesheet" href="assets/louverse.css">
</head>
<body>
  <!-- THE BOARD (L 2026-10-03): a slim header, then one big canvas. TILES are DOM widgets placed in world pixels; CORE
       (core/*) holds the logic per domain; WIRES (the SVG arrows) run from every tile that SETS a store key to every tile
       that FOLLOWS it and light up when the key changes. Tiles write back too (the Job and Notes tiles save through core). -->
  <header class="lv-head">
    <a class="logo" href="https://luissolutions.us/websites/index.html" title="Luis' Web Space"><img class="mark" src="assets/icon-64.png" alt=""><span class="txt">Luis' <span class="web">Web</span> Space</span></a>   <!-- phone: the mark alone (L 2026-10-04 "get rid of Luis Web Space, just the logo in the mobile view") -->
    <nav>
      <a href="https://luissolutions.us/index.html">Home</a>
      <a href="https://luissolutions.us/websites/index.html">Websites</a>
      <a href="https://luissolutions.us/hub.html">Hub</a>
      <a href="https://luissolutions.us/apps/online/onlinelinks.html">Links</a>
    </nav>
    <button type="button" class="lv-btn primary" id="add">+ Tile</button>
    <button type="button" class="lv-btn ico" id="fit" title="fit every tile on screen (or double-tap empty space)">⊡</button>
    <button type="button" class="lv-btn ico" id="zout" title="zoom out">−</button>
    <button type="button" class="lv-btn ico" id="zin" title="zoom in">+</button>
    <span class="sp"></span>
    <span class="who" id="who">…</span>
    <select id="base-pick" class="lv-base" hidden title="which account's tree the board reads - Luis only, for testing (edits land in that account's data)"></select>
    <button type="button" class="lv-btn" id="auth-btn">Sign in</button>
  </header>

  <div class="lv-view" id="view" aria-label="Board">
    <div class="lv-world" id="world">
      <svg class="lv-links" id="links" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div class="lv-status" id="status"></div>

  <script type="module">
    import { whenAuthReady, onUser, baseFor, signIn, signOutNow, LUIS_UID, readOnce } from "./core/firebase.js";
    import { store } from "./core/store.js";
    import { loadLayout, saveLayout, addTile, removeTile, getLayout, resetLayout, NARROW, GUTTER, columnLayout, byOrd, setLive, ensureLive } from "./core/layout.js";
    import { mountTile } from "./ui/tile.js";
    import { mountBoard } from "./ui/board.js";
    import * as year from "./ui/tiles/year.js";
    import * as joblist from "./ui/tiles/joblist.js";
    import * as jobcard from "./ui/tiles/jobcard.js";
    import * as photoset from "./ui/tiles/photoset.js";
    import * as ledger from "./ui/tiles/ledger.js";
    import * as analytics from "./ui/tiles/analytics.js";
    import * as notes from "./ui/tiles/notes.js";
    import * as page from "./ui/tiles/page.js";
    import * as entry from "./ui/tiles/entry.js";
    import * as contact from "./ui/tiles/contact.js";
    import * as invoice from "./ui/tiles/invoice.js";
    import * as bookmarks from "./ui/tiles/bookmarks.js";
    import * as details from "./ui/tiles/details.js";

    // the tile registry: type -> { title, mount, pub, sub } (each tile file declares its own pub / sub). The wires on the
    // board come from these. A new tile kind = one file in ui/tiles + one line here.
    const TILES = { year, joblist, jobcard, contact, invoice, details, photoset, ledger, entry, bookmarks, analytics, notes, page };
    // folded away (L 2026-10-04 "instead of things having redundant data like Visit and Contact"): Entry = the form, Details = the
    // read-all. The two types stay registered so a saved board still renders them; they just leave the menu and the sets.
    const HIDDEN = new Set(["jobcard", "contact", "entry"]);   // + entry 2026-10-04: Details is the one tile (editable) for a visit or a ledger row
    const DESC = { year: "the year the money tiles read", joblist: "your site visits, searchable - sets the visit", jobcard: "the picked visit alone, edit in place", photoset: "the picked visit's photos, or the picked ledger row's receipt", entry: "(folded into Details)", contact: "the visit's customer as a contact card, edit in place", invoice: "the visit's invoice, or the invoices a row paid or was used in", bookmarks: "all your Saved Links - search, categories, add one; a picked visit or vendor becomes a filter chip", details: "everything about what you tapped last - the visit, editable, with invoice, daily entries, other visits, device lists, device data - or the ledger row", ledger: "the year's spending", analytics: "the year at a glance, follows the year", notes: "your notes, edit in place", page: "any page in a frame" };
    // the local apps, one tile each (L): a page tile pointed at the app
    const LOCAL = [["Calculator", "calc"], ["Checklist", "checklist"], ["Converter", "converter"], ["Counter", "count"], ["Password", "password"]];
    const $ = id => document.getElementById(id), viewEl = $("view"), worldEl = $("world"), linksEl = $("links"), status = $("status");
    const mounted = new Map();   // tile id -> api
    let layout = null;
    let flashT = 0; const flash = t => { status.textContent = t; clearTimeout(flashT); flashT = setTimeout(() => { status.textContent = ""; }, 1600); };

    const board = mountBoard(viewEl, worldEl, linksEl, { onView: v => { if (layout) { layout.view = { x: v.x, y: v.y, s: v.s }; saveLayout(layout); } } });
    // fit: everything in view - on a phone that means the one-column board at zoom 1, not a shrunken map
    const fitNow = () => { if (NARROW()) { columnLayout(layout); render(); board.fit(layout.tiles); } else board.fit(layout.tiles); };
    // phone: ▲ / ▼ on a tile's header moves it one place up / down the column (L 2026-10-04 "via arrows instead of drag")
    // STARTER SETS + CLEAR (L 2026-10-04 "add a clear the grid button or a default create a set"): a set drops its tiles in rows of
    // three around the middle of the view (or down the phone column); the wires come from the tiles' own pub / sub.
    const SETS = {
      money: { name: "Money set", desc: "Year · Ledger · Details · Photos · Analytics", tiles: ["year", "ledger", "details", "photoset", "analytics"] },
      visits: { name: "Visits set", desc: "Visits · Details · Invoice · Photos · Bookmarks", tiles: ["joblist", "details", "invoice", "photoset", "bookmarks"] },
      all: { name: "Everything", desc: "every tile, wired", tiles: ["year", "joblist", "details", "invoice", "photoset", "ledger", "bookmarks", "analytics", "notes"] } };
    function addSet(key) {
      const set = SETS[key]; if (!set) return;
      const vr = viewEl.getBoundingClientRect(), [cx, cy] = board.toWorld(vr.left + vr.width / 2, vr.top + vr.height / 2);
      let x = cx - 700, y = cy - 400, rowH = 0, n = 0;
      for (const t of set.tiles) { const spec = addTile(t, { x, y }); rowH = Math.max(rowH, spec.h); x += spec.w + 40; if (++n % 3 === 0) { x = cx - 700; y += rowH + 40; rowH = 0; } }
      layout = getLayout(); if (NARROW()) columnLayout(layout); render(); flash("added the " + set.name.toLowerCase()); }
    const nudge = (spec, dir) => { const order = [...layout.tiles].sort(byOrd), i = order.indexOf(spec), j = i + dir; if (i < 0 || j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]]; order.forEach((t, k) => { t.ord = k; t.y = k; }); columnLayout(layout); render(); flash(dir < 0 ? "moved up" : "moved down");
      mounted.get(spec.id)?.el.scrollIntoView({ block: "nearest", behavior: "smooth" }); };
    board.setFitAll(fitNow);
    const tileEls = () => new Map([...mounted].map(([id, api]) => [id, api.el]));
    const wires = () => board.drawArrows(layout.tiles, TILES);

    // TWO OF THE SAME TILE (L 2026-10-04, third cut - "I have 2 Photos tiles open but both Ledger and Visits are updating the
    // same one"; his rule: "once a 2nd tile is opened the PARENT takes ownership of that one only - cycle only when there is a
    // single one it can update"): ownership is per PARENT. A pick carries a key; keys belong to a parent group (visitId + visit =
    // the Visits list, tx = the Ledger, photoPick = Details, year = Year). With ONE copy of a type it takes every parent. With
    // two or more, the first pick from a parent claims the LIVE copy (the newest / the one you tapped ●) for that parent, and from
    // then on that parent always updates that copy - so Visits drives one Photos tile and the Ledger the other. Opening another
    // copy holds the old ones (they keep what they show, and the parent that fed each one last stays theirs); ● on a copy = the
    // next pick, whichever parent, moves to it. Refresh signals (base, saves) still reach every copy.
    const CLAIMED = new Set(["visitId", "visit", "tx", "year", "photoPick"]);
    const PARENT = { visitId: "visits", visit: "visits", tx: "ledger", photoPick: "details", year: "year" };
    const owners = new Map();   // "<type>|<parent>" -> tile id
    const lastParent = new Map();   // tile id -> the parent that fed it last (survives an add: that parent stays its own)
    const grabNext = new Map();   // type -> tile id that takes the next pick (● tapped)
    const peersOf = type => layout.tiles.filter(t => t.type === type && mounted.has(t.id)).sort((a, b) => a.id < b.id ? -1 : 1);
    const ownsOf = id => [...owners.entries()].filter(([, v]) => v === id).map(([s]) => s.split("|")[1]);
    const markOwners = () => { for (const [id, api] of mounted) { const o = ownsOf(id); api.el.dataset.owns = o.join(", "); api.el.classList.toggle("owns", o.length > 0); } };
    const scopedStore = spec => ({ get: store.get, all: store.all, set: store.set,
      on: (key, fn) => store.on(key, (v, k) => {
        if (CLAIMED.has(key)) {
          const peers = peersOf(spec.type);
          if (peers.length > 1) {
            const parent = (key === "tx" && v == null) ? "visits" : (PARENT[key] || key), slot = spec.type + "|" + parent;   // a cleared tx comes from a Visits tap - it must not reach the Ledger's copy
            const grab = grabNext.get(spec.type);
            if (grab && mounted.has(grab)) { owners.set(slot, grab); grabNext.delete(spec.type); markOwners(); }
            let own = owners.get(slot);
            if (!own || !mounted.has(own)) {   // this parent has no copy yet: the copy it fed last (continuity), else the live copy, else a copy owning nothing, else the newest
              const live = peers.find(t => !t.held), free = peers.filter(t => !ownsOf(t.id).length), prev = free.find(t => lastParent.get(t.id) === parent);
              own = (prev || ((live && free.includes(live)) ? live : free[0] || live || peers[peers.length - 1])).id; owners.set(slot, own); markOwners(); }
            if (own !== spec.id) return;
            lastParent.set(spec.id, parent);
          } else lastParent.set(spec.id, PARENT[key] || key);
        }
        fn(v, k); }) });
    // after a copy is added or removed: every old copy keeps ONLY the parent that fed it last; the rest is up for grabs again
    const pruneOwners = () => { for (const [slot, id] of [...owners]) { const [type, parent] = slot.split("|"); if (!mounted.has(id) || peersOf(type).length < 2 || lastParent.get(id) !== parent) owners.delete(slot); } markOwners(); };
    function render() {
      for (const t of mounted.values()) t.el.remove(); mounted.clear();
      // the n-th copy of a type (by creation order = id) gets a lighter shade of the type's colour (ui/tile.js tintTile)
      const nth = new Map(); for (const spec of layout.tiles.slice().sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0)) { spec.nth = nth.get(spec.type) || 0; nth.set(spec.type, spec.nth + 1); }
      ensureLive(layout);
      for (const spec of layout.tiles) {
        const def = TILES[spec.type]; if (!def) continue;
        spec.copies = nth.get(spec.type) || 1;   // the header shows ● / 📌 only when a type has more than one copy
        const api = mountTile(worldEl, spec, def, { store: scopedStore(spec), board, save: () => saveLayout(layout) }, {
          onMove: () => wires(),
          onChange: (s, settled) => { if (NARROW() && settled) { columnLayout(layout); render(); flash("saved"); return; } saveLayout(layout); wires(); flash("saved"); },   // phone: a taller tile pushes the ones below it down
          onNudge: nudge,
          onLive: s => { setLive(s.id); grabNext.set(s.type, s.id); layout = getLayout();   // no remount - every copy keeps what it shows
            for (const api of mounted.values()) { api.el.classList.toggle("held", !!api.spec.held); const b = api.el.querySelector(".live"); if (b) { b.textContent = api.spec.held ? "📌" : "●"; b.title = api.spec.held ? "held - keeps what it shows; tap and the next pick comes here" : "live - the next pick comes here"; } }
            markOwners(); flash(TILES[s.type].title + " · the next pick goes here"); },
          onRemove: s => { removeTile(s.id); mounted.delete(s.id); layout = getLayout(); ensureLive(layout); saveLayout(layout); wires(); if (NARROW()) { columnLayout(layout); render(); } else if (layout.tiles.some(t => t.type === s.type)) render(); else pruneOwners(); flash("removed"); } });
        mounted.set(spec.id, api);
      }
      pruneOwners(); wires(); board.fitWorld(layout.tiles);
    }
    // a tile asks for another kind on the board (Details "✎ Edit in Entry"): light the one that exists, else add one beside the asker
    window.addEventListener("lv:tile", e => { const { type, from } = e.detail || {}; if (!TILES[type]) return;
      const have = layout.tiles.find(t => t.type === type); if (have) { const api = mounted.get(have.id); if (api) { api.el.classList.remove("lit"); void api.el.offsetWidth; api.el.classList.add("lit"); api.el.style.zIndex = 9999; } flash(TILES[type].title + " is on the board"); return; }
      const src = from && layout.tiles.find(t => t.id === from); const at = src ? { x: src.x + src.w + 40, y: src.y } : (() => { const vr = viewEl.getBoundingClientRect(), [wx, wy] = board.toWorld(vr.left + vr.width / 2, vr.top + vr.height / 2); return { x: wx - 200, y: wy - 120 }; })();
      addTile(type, at); layout = getLayout(); if (NARROW()) columnLayout(layout); render(); flash("added " + TILES[type].title); });
    // a key changed somewhere: its wires light up and the tiles on the receiving end flash
    store.on("*", (v, key) => board.pulse(key, tileEls()));

    // + Tile: lands in the middle of what you are looking at
    $("add").onclick = e => { e.stopPropagation(); document.querySelector(".lv-pop")?.remove();
      const pop = document.createElement("div"); pop.className = "lv-pop";
      pop.innerHTML = Object.keys(TILES).filter(t => !HIDDEN.has(t)).map(t => `<button type="button" data-t="${t}">${TILES[t].title}<small>${DESC[t]}</small></button>`).join("")
        + `<div class="lv-pop-h">Local apps</div>` + LOCAL.map(([n, f]) => `<button type="button" data-t="page" data-url="https://luissolutions.us/apps/local/${f}.html" data-title="${n}">${n}<small>apps/local/${f}</small></button>`).join("")
        + `<div class="lv-pop-h">Board</div>` + Object.entries(SETS).map(([k, v]) => `<button type="button" data-set="${k}">${v.name}<small>${v.desc}</small></button>`).join("")
        + `<button type="button" data-clear="1">Clear the board<small>every tile off - an empty grid</small></button>`
        + `<button type="button" data-reset="1">Reset the board<small>back to the starting layout</small></button>`;
      const r = e.currentTarget.getBoundingClientRect(); pop.style.left = Math.min(r.left, innerWidth - 250) + "px"; pop.style.top = (r.bottom + 4) + "px"; document.body.appendChild(pop);
      pop.onclick = ev => { const b = ev.target.closest("[data-t],[data-reset],[data-set],[data-clear]"); if (!b) return; pop.remove();
        if (b.dataset.reset) { layout = resetLayout(); render(); fitNow(); flash("reset"); return; }
        if (b.dataset.clear) { layout.tiles.length = 0; saveLayout(layout); render(); flash("cleared"); return; }
        if (b.dataset.set) { addSet(b.dataset.set); return; }
        const vr = viewEl.getBoundingClientRect(), [wx, wy] = board.toWorld(vr.left + vr.width / 2, vr.top + vr.height / 2);
        const cfg = b.dataset.url ? { url: b.dataset.url, title: b.dataset.title } : {};
        const spec = addTile(b.dataset.t, { x: wx - 200, y: wy - 120 }, cfg); layout = getLayout(); if (NARROW()) columnLayout(layout); render(); flash("added " + (cfg.title || TILES[b.dataset.t].title));   // phone: the new tile joins the column (L 2026-10-04 "new tiles not fitting on the mobile board")
        if (NARROW()) mounted.get(spec.id)?.el.scrollIntoView({ block: "nearest", behavior: "smooth" }); };
      setTimeout(() => document.addEventListener("click", () => pop.remove(), { once: true }), 0); };
    $("fit").onclick = fitNow;
    $("zin").onclick = () => { const r = viewEl.getBoundingClientRect(); board.zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25); };
    $("zout").onclick = () => { const r = viewEl.getBoundingClientRect(); board.zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.25); };

    // sign in / out - the person types their own credentials here; nothing is stored by this page
    $("auth-btn").onclick = async () => {
      if (store.get("user")) { await signOutNow(); return; }
      const sheet = document.createElement("div"); sheet.className = "lv-sheet";
      sheet.innerHTML = `<form><h3>Sign in</h3><input type="email" placeholder="email" autocomplete="username" required><input type="password" placeholder="password" autocomplete="current-password" required><div class="lv-err" hidden></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="lv-btn" data-x>Cancel</button><button type="submit" class="lv-btn primary">Sign in</button></div></form>`;
      document.body.appendChild(sheet); sheet.querySelector("[data-x]").onclick = () => sheet.remove(); sheet.onclick = e => { if (e.target === sheet) sheet.remove(); };
      sheet.querySelector("form").onsubmit = async e => { e.preventDefault(); const [em, pw] = sheet.querySelectorAll("input"); const err = sheet.querySelector(".lv-err");
        try { await signIn(em.value.trim(), pw.value); sheet.remove(); } catch (x) { err.hidden = false; err.textContent = "Sign-in failed: " + (x.code || x.message); } };
    };

    // boot: the board from this browser, the first auth answer, then the tiles; a later sign-in / out remounts them for that account
    layout = loadLayout();
    if (NARROW()) { columnLayout(layout); render(); board.fit(layout.tiles); }   // a phone always opens columned for THIS orientation (a board saved upright re-flows to two columns sideways, and back)
    else { render(); if (!board.setView(layout.view)) fitNow(); }
    // ROTATE (L 2026-10-04 "a proper view also for landscape"): the phone class follows the device, and a phone that turns re-columns
    // (one column upright, two sideways); a desktop window that crosses 640 px switches modes the same way
    let wasPhone = NARROW(), rsT = 0;
    addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { const now = NARROW(); document.documentElement.classList.toggle("lv-phone", now);
      if (now) { columnLayout(layout); render(); board.fitWorld(layout.tiles); } else if (wasPhone) { render(); board.fit(layout.tiles); } wasPhone = now; }, 150); });
    whenAuthReady().then(async u => { await boot(u); onUser(async u2 => { if ((u2?.uid || null) !== (store.get("user")?.uid || null)) await boot(u2); }); });
    // WHICH TREE (L 2026-10-04 "for testing, a dropdown of each user's firebase when logged into mine"): Luis's uid may read and
    // write every tree, so when he is signed in the header dropdown picks the account the board reads; remembered per browser.
    const pickEl = $("base-pick");
    async function pickedBase(user) {
      const luis = !!user && user.uid === LUIS_UID; pickEl.hidden = !luis; if (!luis) return baseFor(user);
      if (!pickEl.options.length) {
        const dir = (await readOnce("share/directory").catch(() => null)) || {};
        const opts = [[user.uid, "Luis (mine)"], ...Object.entries(dir).filter(([u]) => u !== user.uid).map(([u, v]) => [u, (v && v.name) || u.slice(0, 6)]), ["public", "public (signed-out tree)"]];
        pickEl.innerHTML = opts.map(([v, n]) => `<option value="${v}">${n}</option>`).join("");
      }
      let saved = ""; try { saved = localStorage.getItem("lv_base_pick") || ""; } catch (_) {}
      const base = saved && [...pickEl.options].some(o => o.value === saved) ? saved : user.uid; pickEl.value = base; return base;
    }
    pickEl.onchange = () => { try { localStorage.setItem("lv_base_pick", pickEl.value); } catch (_) {}
      store.set("visitId", null); store.set("visit", null); store.set("tx", null); store.set("base", pickEl.value);
      for (const api of mounted.values()) api.remount(); flash("reading " + pickEl.selectedOptions[0].text); };
    async function boot(user) {
      store.set("user", user); store.set("visitId", null); store.set("visit", null); store.set("base", await pickedBase(user));
      $("who").textContent = user ? user.email : "not signed in"; $("auth-btn").textContent = user ? "Sign out" : "Sign in";
      for (const api of mounted.values()) api.remount(); flash(user ? "signed in" : "local board");
    }
    window.__lv = { store, getLayout, mounted, board };   // test hook
  </script>
</body>
</html>
